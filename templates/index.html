<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div id="app">

    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar">

        <div id="sidebar-header">
            <h1>Travel Planner</h1>
            <div id="transport-modes">
                <button class="mode-btn active" data-mode="driving" title="Auto">&#128663; Auto</button>
                <button class="mode-btn" data-mode="cycling" title="Bicicletta">&#128692; Bici</button>
                <button class="mode-btn" data-mode="walking" title="A piedi">&#128694; Piedi</button>
                <button class="mode-btn" data-mode="motorcycle" title="Moto">&#127949; Moto</button>
                <button class="mode-btn" data-mode="electric" title="Auto Elettrica">&#9889; EV</button>
            </div>

            <!-- Preferenza curve: visibile solo in modalità Moto -->
            <div id="curves-control" class="hidden">
                <div class="curves-label">
                    <span>Preferenza curve</span>
                    <span id="curves-badge">1 / 5</span>
                </div>
                <input id="curves-slider" type="range" min="1" max="5" value="1" step="1"
                       oninput="onCurvesChange(this.value)" />
                <div class="curves-hints">
                    <span>1 – Diretto</span>
                    <span>5 – Panoramico</span>
                </div>
            </div>
        </div>

        <div id="sidebar-body">

            <!-- EV Panel: visibile solo in modalità EV -->
            <div id="ev-panel" class="hidden">
                <div class="ev-section">
                    <div class="ev-section-title">&#128663; Veicolo</div>
                    <select id="ev-vehicle-select" onchange="selectEvVehicle(this.value)">
                        <option value="">-- Seleziona modello --</option>
                    </select>
                    <div class="ev-specs-grid">
                        <div class="ev-spec-cell">
                            <label>Autonomia (km)</label>
                            <input id="ev-range" class="ev-spec-input" type="number" min="50" max="1200" value="400" />
                        </div>
                        <div class="ev-spec-cell">
                            <label>Consumo (kWh/100km)</label>
                            <input id="ev-consumption" class="ev-spec-input" type="number" min="5" max="60" step="0.1" value="17" />
                        </div>
                        <div class="ev-spec-cell">
                            <label>Batteria (kWh)</label>
                            <input id="ev-battery-kwh" class="ev-spec-input" type="number" min="10" max="250" step="0.5" value="60" />
                        </div>
                        <div class="ev-spec-cell">
                            <label>Ricarica max DC (kW)</label>
                            <input id="ev-max-dc" class="ev-spec-input" type="number" min="7" max="400" value="100" />
                        </div>
                    </div>
                </div>
                <div class="ev-section">
                    <div class="ev-section-title">&#128267; Batteria</div>
                    <div class="ev-pct-row">
                        <span class="ev-pct-label">Partenza</span>
                        <input id="ev-start-pct" type="range" min="10" max="100" value="80" step="5"
                               oninput="document.getElementById('ev-start-badge').textContent=this.value+'%'" />
                        <span id="ev-start-badge" class="ev-pct-badge">80%</span>
                    </div>
                    <div class="ev-pct-row">
                        <span class="ev-pct-label">Minimo</span>
                        <input id="ev-min-pct" type="range" min="5" max="40" value="15" step="5"
                               oninput="document.getElementById('ev-min-badge').textContent=this.value+'%'" />
                        <span id="ev-min-badge" class="ev-pct-badge">15%</span>
                    </div>
                    <div class="ev-pct-row">
                        <span class="ev-pct-label">Ricarica a</span>
                        <input id="ev-max-pct" type="range" min="50" max="100" value="80" step="5"
                               oninput="document.getElementById('ev-max-badge').textContent=this.value+'%'" />
                        <span id="ev-max-badge" class="ev-pct-badge">80%</span>
                    </div>
                </div>
                <div class="ev-section">
                    <div class="ev-section-title">&#9889; Stazioni</div>
                    <div class="ev-filter-row">
                        <label>Connettore</label>
                        <select id="ev-connector">
                            <option value="33">CCS (Combo 2)</option>
                            <option value="2">CHAdeMO</option>
                            <option value="25">Type 2 AC</option>
                        </select>
                    </div>
                    <div class="ev-filter-row">
                        <label>Potenza min.</label>
                        <select id="ev-min-kw">
                            <option value="22">&#8805; 22 kW</option>
                            <option value="50" selected>&#8805; 50 kW</option>
                            <option value="100">&#8805; 100 kW</option>
                            <option value="150">&#8805; 150 kW</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Salva / Carica itinerario -->
            <div id="save-load-section">
                <div id="save-load-btns">
                    <button id="btn-export-itinerary" onclick="exportItinerary()">&#128190; Salva itinerario</button>
                    <label id="btn-import-itinerary" for="import-file-input">&#128193; Carica itinerario</label>
                    <input id="import-file-input" type="file" accept=".json" style="display:none"
                           onchange="importItinerary(this.files[0])" />
                </div>
            </div>

            <!-- Importa da Google Maps -->
            <div id="import-gmaps-section">
                <button id="import-gmaps-toggle" onclick="toggleImportSection()">
                    &#128279; Importa percorso da Google Maps
                </button>
                <div id="import-gmaps-form" class="hidden">
                    <input id="gmaps-url-input" type="url"
                        placeholder="Incolla il link Google Maps..." />
                    <button id="import-gmaps-btn" onclick="importGmapsUrl()">Importa</button>
                </div>
            </div>

            <!-- Waypoints: solo posizioni, date/ora sui tratti dopo calcolo -->
            <div id="waypoints-container">
                <div id="waypoints-list"></div>
                <button id="add-waypoint-btn">+ Aggiungi tappa</button>
            </div>

            <!-- Campionatura meteo/traffico -->
            <div id="sample-control">
                <label class="sample-label" for="sample-interval-select">Dettaglio meteo/traffico:</label>
                <select id="sample-interval-select" class="sample-select">
                    <option value="5">ogni 5 km</option>
                    <option value="10">ogni 10 km</option>
                    <option value="20" selected>ogni 20 km</option>
                    <option value="30">ogni 30 km</option>
                    <option value="50">ogni 50 km</option>
                </select>
            </div>

            <!-- Controls -->
            <div id="route-controls">
                <button id="calculate-route-btn" class="primary-btn">Calcola percorso</button>
                <button id="clear-route-btn" class="danger-btn">Azzera</button>
            </div>

            <!-- Legs panel injected here by JS after route calculation -->

        </div>
    </div>

    <!-- ===== MAP ===== -->
    <div id="map"></div>

    <!-- ===== TOGGLE LAYER MAPPA ===== -->
    <div id="map-layer-toggle" class="hidden">
        <span class="map-toggle-label">Mappa:</span>
        <button class="map-toggle-btn" id="btn-view-weather" onclick="setMapView('weather')">&#127780; Meteo</button>
        <button class="map-toggle-btn" id="btn-view-traffic" onclick="setMapView('traffic')">&#128678; Traffico</button>
        <button class="map-toggle-btn map-toggle-none" onclick="setMapView('none')" title="Nascondi">&#10005;</button>
    </div>

    <!-- ===== TOGGLE STAZIONI EV ===== -->
    <div id="ev-map-toggle" class="hidden">
        <button id="btn-toggle-ev-markers" class="active" onclick="toggleEvMarkers()" title="Nascondi stazioni EV">&#9889; Stazioni EV</button>
    </div>

    <!-- ===== SEARCH DROPDOWN ===== -->
    <div id="search-suggestions" class="hidden"></div>

    <!-- ===== LOADING ===== -->
    <div id="loading" class="hidden">
        <div class="loading-box">
            <div class="spinner"></div>
            <span>Elaborazione...</span>
        </div>
    </div>

    <!-- ===== MOBILE TOGGLE (hidden on desktop) ===== -->
    <button id="mobile-map-toggle" onclick="toggleMobileView()">&#128506; Mappa</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
